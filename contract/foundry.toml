[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 100
tab_width = 4

[rpc_endpoints]
bnb_testnet = "${BNB_TESTNET_RPC_URL}"
opbnb_testnet = "${OPBNB_TESTNET_RPC_URL}"
